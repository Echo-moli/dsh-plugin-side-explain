name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (both halves)
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
          node -e "const y=require('fs').readFileSync('cordis.patch.yml','utf8'); if(!y.includes('dsh-plugin-side-explain')) { throw new Error('patch must reference the package name') }; console.log('cordis.patch.yml ok')"
      - name: Guard against accidental session writes
        run: |
          if grep -nE "session\.prompt|beginSubmission|sessionController\.(prompt|create)" lib/*.js; then
            echo "::error::this plugin must never write to a session"
            exit 1
          fi
